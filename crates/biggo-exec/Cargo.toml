[package]
name = "biggo-exec"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arrow = { version = "60.0.0", default-features = false, features = ["csv", "json", "prettyprint"] }
biggo-plan.workspace = true
calamine = { version = "0.36.1", features = ["dates"] }
encoding_rs = "0.8.42"
glob = "0.3.4"
hashbrown = "0.17.1"
memmap2 = "0.9.11"
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "snap", "zstd"] }
rayon = "1.12.0"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust_xlsxwriter = "0.99.1"
serde_json = { version = "1", features = ["preserve_order"] }
