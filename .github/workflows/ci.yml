name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run the tests
        run: cargo test --workspace --no-fail-fast

  databases:
    name: Databases
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: biggo
          POSTGRES_DB: shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d shop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: biggo-root
          MYSQL_DATABASE: shop
          MYSQL_USER: app
          MYSQL_PASSWORD: biggo
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -uapp -pbiggo --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Read and write a PostgreSQL and a MySQL server
        env:
          BIGGO_TEST_POSTGRES: postgres://app:biggo@localhost:5432/shop
          BIGGO_TEST_MYSQL: mysql://app:biggo@127.0.0.1:3306/shop
        run: cargo test -p biggo-cli --test cli server_is_read_and_written

  lint:
    name: Format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check the formatting
        run: cargo fmt --all --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  editor:
    name: Editor grammar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The grammar lists every built-in function
        run: |
          python3 editors/vscode/sync-builtins.py
          git diff --exit-code -- editors/vscode/syntaxes
