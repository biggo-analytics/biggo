[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/biggo-analytics/biggo"

[workspace.dependencies]
biggo-syntax = { path = "crates/biggo-syntax" }
biggo-types = { path = "crates/biggo-types" }
biggo-plan = { path = "crates/biggo-plan" }
biggo-exec = { path = "crates/biggo-exec" }
biggo-eval = { path = "crates/biggo-eval" }
biggo-fmt = { path = "crates/biggo-fmt" }
biggo-lsp = { path = "crates/biggo-lsp" }
unicode-ident = "1"

[profile.release]
lto = "thin"
codegen-units = 1
